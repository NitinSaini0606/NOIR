<!doctype html>
<html lang="en" class="auth-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NOIR</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="NOIR home">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>NOIR</span>
    </a>
    <a class="header-link" href="signup.html">Create an account</a>
  </header>

  <main class="auth-shell">
    <section class="auth-intro" aria-label="NOIR introduction">
      <div class="intro-copy">
        <span class="eyebrow">Your table is ready</span>
        <h1>Good food.<br>Good mood.</h1>
        <p>Discover delicious dishes from around the world, delivered straight to your door.</p>
      </div>
      <div class="food-orbit" aria-hidden="true">🍜</div>
    </section>

    <section class="auth-card">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Sign in to continue your food journey.</p>
      <form class="auth-form" id="login-form" novalidate>
        <div class="field">
          <label for="login-identifier">Email or phone number</label>
          <input id="login-identifier" name="identifier" type="text" autocomplete="username" placeholder="you@example.com" required>
          <span class="field-error" data-error-for="login-identifier"></span>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <input class="has-toggle" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="toggle-password" type="button" data-password-toggle="login-password" aria-label="Show password">Show</button>
          </div>
          <span class="field-error" data-error-for="login-password"></span>
        </div>
        <div class="form-message" id="login-message" role="alert"></div>
        <button class="primary-button" type="submit">Sign in</button>
      </form>
      <p class="auth-switch">New to NOIR? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
  <script type="module" src="../js/auth-page.js"></script>
</body>
</html>
