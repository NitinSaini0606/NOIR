<!doctype html>
<html lang="en" class="auth-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | NOIR</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="NOIR home">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>NOIR</span>
    </a>
    <a class="header-link" href="login.html">Already a member?</a>
  </header>

  <main class="auth-shell">
    <section class="auth-intro" aria-label="NOIR introduction">
      <div class="intro-copy">
        <span class="eyebrow">A world of flavor</span>
        <h1>Make every bite count.</h1>
        <p>Join a community that believes the best moments start with something delicious.</p>
      </div>
      <div class="food-orbit" aria-hidden="true">🥗</div>
    </section>

    <section class="auth-card">
      <h2>Create account</h2>
      <p class="auth-subtitle">Set up your account in a few seconds.</p>
      <form class="auth-form" id="signup-form" novalidate>
        <div class="field">
          <label for="signup-name">Full name</label>
          <input id="signup-name" name="fullName" type="text" autocomplete="name" placeholder="Alex Morgan" required>
          <span class="field-error" data-error-for="signup-name"></span>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <span class="field-error" data-error-for="signup-email"></span>
        </div>
        <div class="field">
          <label for="signup-phone">Phone number</label>
          <input id="signup-phone" name="phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210" required>
          <span class="field-error" data-error-for="signup-phone"></span>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <div class="input-wrap">
            <input class="has-toggle" id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
            <button class="toggle-password" type="button" data-password-toggle="signup-password" aria-label="Show password">Show</button>
          </div>
          <span class="field-error" data-error-for="signup-password"></span>
        </div>
        <div class="field">
          <label for="signup-confirm-password">Confirm password</label>
          <div class="input-wrap">
            <input class="has-toggle" id="signup-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" required>
            <button class="toggle-password" type="button" data-password-toggle="signup-confirm-password" aria-label="Show password">Show</button>
          </div>
          <span class="field-error" data-error-for="signup-confirm-password"></span>
        </div>
        <div class="form-message" id="signup-message" role="alert"></div>
        <button class="primary-button" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </section>
  </main>
  <script type="module" src="../js/auth-page.js"></script>
</body>
</html>
